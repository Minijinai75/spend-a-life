*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#eef3ff}
body{font-family:var(--font);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.paused *,.paused *::before,.paused *::after{animation-play-state:paused !important}

/* ===================== 舞台 ===================== */
.stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(170deg,var(--blue) 0%,#eef3ff 42%,var(--purple) 100%)}
.bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;animation:drift 18s ease-in-out infinite alternate}
.b1{width:70vmax;height:70vmax;left:-25vmax;top:-32vmax;background:radial-gradient(circle,rgba(160,196,255,.55),rgba(160,196,255,0) 62%)}
.b2{width:64vmax;height:64vmax;right:-26vmax;bottom:-30vmax;background:radial-gradient(circle,rgba(200,180,255,.6),rgba(200,180,255,0) 62%);animation-duration:23s}
.b3{width:44vmax;height:44vmax;left:34%;top:38%;background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,0) 66%);animation-duration:27s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vmax,4vmax) scale(1.12)}}

.sc{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .55s ease,visibility 0s linear .55s}
.sc.on{opacity:1;visibility:visible;transition:opacity .6s ease .12s,visibility 0s}

.prog{position:fixed;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.55);z-index:60}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue-deep),var(--purple-deep))}

.ctrls{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:60}
.cb{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.82);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;opacity:.72;transition:opacity .2s,transform .15s}
.cb:hover,.cb:focus-visible{opacity:1}
.cb:active{transform:scale(.94)}
.cb:focus-visible{outline:2px solid var(--purple-deep);outline-offset:2px}
.ico-pause{width:12px;height:13px;border-left:4px solid var(--ink);border-right:4px solid var(--ink)}
.ico-play{width:0;height:0;border-left:11px solid var(--ink);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.ico-re{font-size:19px;font-weight:900;line-height:1;color:var(--ink);margin-top:-2px}

.brandchip{position:absolute;left:max(16px,env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:999px;background:rgba(255,255,255,.78);border:1px solid rgba(227,232,247,.9);box-shadow:var(--shadow);font-size:12.5px;font-weight:900;opacity:0;transform:translateY(-8px);transition:opacity .5s ease,transform .6s var(--ease);z-index:40}
.brandchip::before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--blue-deep),var(--purple-deep))}
.brandchip span{font-size:11.5px;font-weight:700;color:var(--ink2)}
.brandchip.on{opacity:1;transform:none}
.demonote{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));font-size:11px;font-weight:600;color:var(--ink3);opacity:0;transition:opacity .5s;z-index:40;max-width:calc(100% - 120px)}
.demonote.on{opacity:1}

/* ===================== 通用：逐字浮現、淡入 ===================== */
.split .c{display:inline-block;opacity:0;transform:translateY(.45em);filter:blur(8px);transition:opacity .55s var(--ease),transform .75s var(--ease),filter .55s var(--ease);transition-delay:calc(var(--i) * 34ms)}
.split.in .c{opacity:1;transform:none;filter:none}
.fu{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .75s var(--ease)}
.fu.in{opacity:1;transform:none}
.fu:not(.in){pointer-events:none}
.rv{opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .6s var(--ease)}
.rv.in{opacity:1;transform:none}
.gtext{background:linear-gradient(135deg,var(--blue-deep),var(--purple-deep));-webkit-background-clip:text;background-clip:text;color:transparent !important}

/* 點擊回饋：像錄螢幕時手指點下去的那一圈 */
.tapped{animation:press .42s ease}
@keyframes press{0%{transform:scale(1)}35%{transform:scale(.95)}100%{transform:scale(1)}}
.tapdot{position:absolute;left:var(--tx,50%);top:var(--ty,50%);width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(165,139,234,.95);pointer-events:none;animation:tap .65s ease-out forwards;z-index:5}
@keyframes tap{0%{transform:scale(.3);opacity:0}25%{transform:scale(.8);opacity:1}100%{transform:scale(1.65);opacity:0}}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border-radius:16px;background:linear-gradient(175deg,#2b3258,var(--ink));color:#fff;font-weight:800;font-size:16px;letter-spacing:.02em;box-shadow:0 8px 20px -3px rgba(30,36,64,.28);min-height:48px;white-space:nowrap}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid #dbe2f3;box-shadow:0 2px 8px rgba(30,36,64,.04)}

/* ===================== S0 開場：焦慮沒有形狀 ===================== */
.words{position:absolute;inset:0}
.wd{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);font-size:clamp(15px,2.3vw,30px);font-weight:800;color:var(--ink2);opacity:0;white-space:nowrap;transition:opacity .9s ease,left 1s var(--ease),top 1s var(--ease),transform 1s var(--ease),filter 1s}
.wd span{display:inline-block;animation:bob 5s ease-in-out infinite alternate;animation-delay:var(--d)}
.wd.in{opacity:.5}
.wd.hot{color:var(--warn)}
.words.agitate .wd span{animation:jit .42s ease-in-out infinite alternate;animation-delay:var(--d)}
.words.agitate .wd.in{opacity:.62}
.words.collapse .wd,.words.collapse .wd.in{left:50%;top:50%;transform:translate(-50%,-50%) scale(.15);opacity:0;filter:blur(4px)}
@keyframes bob{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
@keyframes jit{0%{transform:translate(-3px,2px) rotate(-3deg)}100%{transform:translate(3px,-2px) rotate(3deg)}}
.hook{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);text-align:center;transition:opacity .55s ease,transform .7s var(--ease)}
.hook.out{opacity:0;transform:translateY(calc(-50% - 30px))}
.hl{font-size:clamp(26px,6.2vw,76px);font-weight:900;letter-spacing:-.02em;line-height:1.28;transition:color .6s}
.hl.dim{color:var(--ink2)}
.hs{font-size:clamp(16px,2.3vw,28px);font-weight:700;color:var(--ink2);margin-top:.9em;line-height:1.6}
.warnc{color:var(--warn)}

/* ===================== S1 片名：活到老，學到老 → 花到老 ===================== */
.sc-title,.sc-end{display:flex;align-items:center;justify-content:center;text-align:center;padding:calc(52px + env(safe-area-inset-top)) 16px 64px}
.tbox,.endbox{display:flex;flex-direction:column;align-items:center;width:100%;max-width:1180px}
.tchip{display:inline-block;font-size:clamp(11px,1.2vw,14px);font-weight:800;letter-spacing:.1em;color:var(--purple-deep);background:rgba(255,255,255,.72);border:1px solid rgba(165,139,234,.35);padding:6px 14px;border-radius:999px}
.bigtitle{font-size:clamp(52px,11.5vw,150px);font-weight:900;letter-spacing:-.03em;line-height:1.1;margin-top:.2em;color:var(--ink)}
.bigtitle .tl{display:inline-block;white-space:nowrap}
.bigtitle .c{display:inline-block;opacity:0;transform:translateY(.35em) scale(.9);filter:blur(10px);color:var(--ink3);transition:opacity .6s var(--ease),transform .95s var(--spring),filter .6s ease,color .6s ease;transition-delay:calc(var(--i) * 70ms)}
.bigtitle.in .c{opacity:1;transform:none;filter:none}
.bigtitle.swapped .c{color:var(--ink)}
.swap{position:relative;perspective:420px}
.swap .f1,.swap .f2{display:inline-block;transition:transform .6s cubic-bezier(.5,0,.2,1),opacity .45s ease}
.swap .f2{position:absolute;left:0;top:0;opacity:0;transform:rotateX(90deg) translateY(.15em)}
.swap::after{content:"";position:absolute;left:-6%;right:-6%;top:56%;height:.075em;border-radius:.05em;background:var(--warn);transform:scaleX(0);transform-origin:left center;transition:transform .35s var(--ease),opacity .3s}
.bigtitle.strike .swap::after{transform:scaleX(1)}
.bigtitle.swapped .swap::after{opacity:0}
.bigtitle.swapped .swap .f1{opacity:0;transform:rotateX(-90deg) translateY(-.15em)}
.bigtitle.swapped .swap .f2{opacity:1;transform:none}
.tsub{margin-top:.9em;font-size:clamp(15px,1.9vw,24px);font-weight:700;color:var(--ink2);line-height:1.65}
.tsub span{display:inline-block}
.acts3{display:flex;gap:12px;margin-top:clamp(18px,3.2vh,34px);flex-wrap:wrap;justify-content:center}
.act{background:rgba(255,255,255,.84);border:1px solid var(--line);border-radius:16px;padding:10px 16px;box-shadow:var(--shadow);text-align:left;display:flex;gap:10px;align-items:baseline}
.act b{font-size:13px;color:var(--purple-deep);font-weight:900;letter-spacing:.06em;white-space:nowrap}
.act span{font-size:clamp(14px,1.4vw,17px);font-weight:800}
.tstart{margin-top:clamp(18px,3.2vh,32px);font-size:clamp(15px,1.5vw,18px);padding:14px 30px}

/* ===================== 三幕分鏡（左文案／右手機） ===================== */
.sc-acts{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:14px;padding:calc(52px + env(safe-area-inset-top)) 16px 60px}
.copy{display:grid;align-self:start}
.cp{grid-area:1/1;opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .7s var(--ease);pointer-events:none}
.cp.on{opacity:1;transform:none}
.cp.out{opacity:0;transform:translateY(-18px)}
.ey{font-size:clamp(12px,1.3vw,15px);font-weight:800;color:var(--purple-deep);letter-spacing:.14em}
.ch2{font-size:clamp(26px,8vw,46px);font-weight:900;letter-spacing:-.02em;line-height:1.2;margin-top:6px}
.cpp{font-size:clamp(14px,1.5vw,19px);color:var(--ink2);margin-top:10px;line-height:1.7;max-width:31em}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.srcs span{font-size:clamp(11px,1.05vw,13px);font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(237,243,255,.95);color:#4a68c2;border:1px solid rgba(127,169,240,.25)}
.slot{position:relative;min-height:0;min-width:0}
.fit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center center}
@media (min-aspect-ratio:1/1){
  .sc-acts{grid-template-columns:minmax(0,1fr) minmax(0,.92fr);grid-template-rows:minmax(0,1fr);gap:clamp(24px,5vw,90px);padding:calc(60px + env(safe-area-inset-top)) clamp(24px,7vw,130px) 56px}
  .copy{align-self:center}
  .ch2{font-size:clamp(30px,4.4vw,66px)}
}
@media (max-aspect-ratio:1/1) and (max-height:720px){
  .cpp,.srcs{display:none}
}

/* ===================== 手機外框與畫面 ===================== */
.device{width:100%;height:100%;border-radius:46px;padding:9px;background:linear-gradient(160deg,#fff,#e8ecf8);box-shadow:0 50px 90px -40px rgba(45,55,110,.55),0 0 0 1px rgba(30,36,64,.07);opacity:0;transform:translateY(46px) scale(.96);transition:opacity .7s ease,transform .95s var(--ease)}
.device.in{opacity:1;transform:none}
.screen{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:linear-gradient(170deg,var(--blue) 0%,#eef3ff 40%,var(--purple) 100%);font-size:14px}
.pg{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateX(26px);transition:opacity .45s ease,transform .6s var(--ease),visibility 0s linear .6s}
.pg.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease .1s,transform .6s var(--ease) .1s,visibility 0s}
.pg.gone{transform:translateX(-26px)}
.pad{padding:14px 12px}
.card{background:#fff;border-radius:20px;padding:14px;border:1px solid rgba(227,232,247,.85);box-shadow:var(--shadow)}
.card + .card{margin-top:10px}
.eyebrow{font-size:11.5px;font-weight:800;color:var(--purple-deep);letter-spacing:.08em}
.ptitle{font-size:19px;font-weight:900;letter-spacing:-.02em;line-height:1.3;margin-top:3px}
.h4{font-size:15px;font-weight:900}
.hint{font-size:11px;color:var(--ink3);margin-top:7px;line-height:1.55}
.hint b{color:var(--ink2)}
.pw{position:relative;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,var(--blue),var(--purple));border:3px solid #fff;box-shadow:var(--shadow-up);flex:0 0 auto}
.pw i{position:absolute;inset:0;background-image:var(--pf);background-size:cover;background-position:center 15%}
.pw-lg{width:84px;height:84px}
.pw-md{width:58px;height:58px}
.pw-sm{width:40px;height:40px;border-width:2px}

/* 角色卡 */
.rolecard{display:flex;gap:14px;align-items:center;margin-top:12px}
.rn{font-size:21px;font-weight:900;letter-spacing:-.02em}
.rj{font-size:12.5px;color:var(--ink2);margin-top:1px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.stat3 .s{background:linear-gradient(160deg,#f4f8ff,#f8f5ff);border-radius:14px;padding:9px 4px;text-align:center;border:1px solid var(--line)}
.stat3 .s b{display:block;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat3 .s span{display:block;font-size:10.5px;color:var(--ink2);margin-top:2px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn-sm{padding:10px 8px;font-size:13.5px;border-radius:12px;min-height:42px;width:100%}
.salsteps{display:flex;gap:6px;margin-top:10px}
.salstep{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:6px 3px;text-align:center;background:#fff}
.salstep .sa{font-size:10.5px;font-weight:800;color:var(--ink2)}
.salstep .sv{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;border-bottom:1.5px solid var(--line);padding:1px 0 2px}
.salstep .su{font-size:9px;color:var(--ink3);margin-top:2px}
.tagph{display:inline-block;font-size:10px;padding:1px 7px;border-radius:999px;background:#edf3ff;color:#4a68c2;font-weight:700;margin-left:4px;vertical-align:1px}

/* 我要的生活：加減表 */
.lifelist{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.lrow{padding:6px 11px 7px;border-bottom:1px solid var(--line);opacity:0;transform:translateX(18px);transition:opacity .35s ease,transform .5s var(--ease),background .4s}
.lrow.in{opacity:1;transform:none}
.lrow:last-child{border-bottom:0}
.lrow.hl{background:#f6f2ff}
.lh{display:flex;align-items:baseline;gap:8px}
.ln{font-size:13px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt{font-size:12.5px;font-weight:900;color:var(--purple-deep);font-variant-numeric:tabular-nums;white-space:nowrap}
.lc{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk{position:relative;height:5px;border-radius:999px;background:#e3e8f7;margin:7px 5px 1px}
.trk i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--blue-deep),var(--purple-deep));width:var(--v)}
.trk b{position:absolute;top:50%;left:var(--v);width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:#fff;border:3px solid var(--purple-deep);box-shadow:0 2px 6px rgba(100,70,200,.25)}
.lifefoot{position:absolute;left:0;right:0;bottom:0;background:rgba(251,252,255,.96);border-top:1px solid var(--line);padding:9px 14px 13px;display:flex;align-items:center;gap:13px;transform:translateY(105%);transition:transform .6s var(--ease)}
.lifefoot.in{transform:none}
.lifefoot .cap{font-size:10px;color:var(--ink2);font-weight:700;white-space:nowrap}
.lifefoot .n{display:inline-block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.1;white-space:nowrap;transform-origin:left center}
.lifefoot .n small{font-size:11px;font-weight:800;margin-left:1px}
.lifefoot .n.big{color:var(--purple-deep)}
.lifefoot .sum{flex:1;min-width:0;font-size:10.5px;color:var(--ink2);line-height:1.45;text-align:right}
.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}

/* 棋盤 */
.hud{background:rgba(253,254,255,.92);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow)}
.hud-top{display:flex;align-items:center;gap:10px}
.hud-who{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.hud .nm{font-size:13px;font-weight:800}
.hud .ag{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.hud-money{display:inline-block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:color .3s;transform-origin:right center}
.hud-money.good{color:var(--good)}
.hud-ml{font-size:10px;color:var(--ink2);font-weight:700;text-align:right}
.freelab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2);font-weight:700;margin-top:7px;font-variant-numeric:tabular-nums}
.freebar{position:relative;height:6px;border-radius:999px;background:#e6e2f2;overflow:hidden;margin-top:4px}
.freebar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue-deep),var(--purple-deep));transition:width .6s var(--ease),background .4s}
.freebar.over i{background:var(--warn)}
.freebar.ret i{background:var(--purple-deep)}
.freebar .eaten{position:absolute;top:0;right:0;height:100%;width:0;background:repeating-linear-gradient(45deg,rgba(232,115,90,.95) 0 5px,rgba(232,115,90,.5) 5px 10px);opacity:0}
.freebar .eaten.go{animation:eat 1.5s ease forwards}
@keyframes eat{0%{opacity:1;width:0}30%{opacity:1;width:24%}75%{opacity:1;width:24%}100%{opacity:0;width:24%}}
.bcard{margin-top:8px;background:#fff;border-radius:20px;padding:10px;border:1px solid rgba(227,232,247,.85);box-shadow:var(--shadow)}
.bview{position:relative;height:250px;overflow:hidden;border-radius:14px;background:#f8faff;border:1px solid rgba(227,232,247,.9)}
.board{position:absolute;left:6px;top:8px;width:286px;height:703px;transition:transform .5s var(--ease)}
.cell{position:absolute;width:53.2px;height:54px;border-radius:11px;background:#fff;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ink3);opacity:0;transform:scale(.55);transition:opacity .3s ease,transform .45s var(--spring),background .3s,border-color .3s,box-shadow .3s;transition-delay:calc(var(--i) * 7ms)}
.board.in .cell{opacity:1;transform:none}
.board.settled .cell{transition-delay:0s}
.cell .cy{font-variant-numeric:tabular-nums;line-height:1.1}
.cell .ci{font-size:13px;line-height:1;margin-top:3px;min-height:13px}
.cell.chance{background:#eef7f2;border-color:#a9d9c3;color:#2b7a5c}
.cell.fate{background:#fdf0ed;border-color:#f0b6a6;color:#b0553f}
.cell.ms{background:#fdf7e6;border-color:#e6c887;color:#8a6516}
.board.in .cell.past{opacity:.5}
.cell.retired{background:var(--purple);border-color:var(--purple-deep);color:var(--ink)}
.board.in .cell.now{opacity:1;border-color:var(--ink);box-shadow:0 0 0 3px rgba(30,36,64,.12),0 4px 10px rgba(30,36,64,.12);transform:scale(1.06);z-index:2}
.pawn{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25);background:linear-gradient(160deg,var(--blue),var(--purple));z-index:4;opacity:0;transition:opacity .3s}
.pawn.in{opacity:1}
.pawn i{position:absolute;inset:0;background-image:var(--pf);background-size:cover;background-position:center 12%}
.legend{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;font-size:10px;color:var(--ink2);margin-top:7px}
.dcard{margin-top:8px;background:#fff;border-radius:20px;padding:12px;border:1px solid rgba(227,232,247,.85);box-shadow:var(--shadow)}
.dicebox{display:flex;align-items:center;gap:12px}
.dice{width:50px;height:50px;flex:0 0 auto;border-radius:13px;background:#fff;border:2px solid var(--ink);box-shadow:var(--shadow-up);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px}
.dice b{width:8px;height:8px;border-radius:50%;background:var(--ink);align-self:center;justify-self:center;opacity:0}
.dice b.on{opacity:1}
.dice.rolling{animation:roll .6s cubic-bezier(.3,.8,.4,1)}
@keyframes roll{0%{transform:rotate(0) scale(1)}30%{transform:rotate(140deg) scale(1.16)}60%{transform:rotate(280deg) scale(.94)}100%{transform:rotate(360deg) scale(1)}}
.dtext{flex:1;font-size:12px;color:var(--ink2);line-height:1.5}
.dtext b{color:var(--ink);font-size:14px}
.dcard .btn{width:100%;margin-top:10px;font-size:15px;min-height:44px;padding:10px}
.dcard .btn-ghost{margin-top:7px;min-height:36px;font-size:12.5px;padding:7px}
.evt{position:absolute;left:12px;right:12px;bottom:12px;border-radius:20px;padding:14px;background:linear-gradient(165deg,#fff,#f8f4ff);border:2px solid var(--purple-deep);box-shadow:0 -12px 40px -12px rgba(45,55,110,.35);transform:translateY(calc(100% + 60px));transition:transform .5s var(--ease);z-index:10}
.evt.in{transform:none}
.evt.chance{border-color:var(--good);background:linear-gradient(165deg,#fff,#f1faf5)}
.evt.fate{border-color:var(--warn);background:linear-gradient(165deg,#fff,#fff5f2)}
.evt .ek{font-size:11px;font-weight:800;letter-spacing:.06em}
.evt.chance .ek{color:#2b7a5c}
.evt.fate .ek{color:#b0553f}
.evt .et{font-size:17px;font-weight:900;line-height:1.35;margin-top:4px}
.evt .es{font-size:12px;color:var(--ink2);margin-top:4px}
.opt{position:relative;display:block;width:100%;text-align:left;margin-top:8px;padding:8px 11px;border-radius:13px;background:#fff;border:1.5px solid var(--line);transition:border-color .2s,background .2s,box-shadow .2s,opacity .3s}
.opt .oh{display:flex;align-items:center;gap:8px}
.opt b{flex:1;font-size:14px;font-weight:800}
.opt .os{display:block;font-size:11.5px;color:var(--ink2);margin-top:1px}
.opt em{display:block;font-size:11px;color:var(--purple-deep);font-style:normal;margin-top:2px;font-weight:600}
.delta{display:inline-block;font-size:11px;font-weight:900;padding:1px 8px;border-radius:999px;white-space:nowrap}
.delta.up{background:#e2f4ec;color:#2b7a5c}
.delta.down{background:#fdeae5;color:#b0553f}
.opt.picked{border-color:var(--purple-deep);background:#f6f2ff;box-shadow:0 0 0 3px rgba(165,139,234,.3)}
.opt.dim{opacity:.42}

/* 終局頁（第三幕在手機裡捲動） */
.endwrap{position:absolute;left:0;right:0;top:0;padding:14px 12px 40px;will-change:transform}

    s.style.setProperty('--x', x[1] + '%'); s.style.setProperty('--y', x[2] + '%');
    s.innerHTML = '<span style="--d:' + (-(i * .7).toFixed(2)) + 's">' + x[0] + '</span>';
    w.appendChild(s);
  });

  // 加減表
  var ll = $('lifelist');
  ROWS.forEach(function(r, i){
    var d = document.createElement('div');
    d.className = 'lrow'; d.id = 'lr' + i;
    var pct = (r.v / r.max * 100).toFixed(1) + '%';
    d.innerHTML = '<div class="lh"><span class="ln">' + r.n + '</span><span class="lt">每月 ' + fmt(r.v) + ' 元</span></div>' +
      '<div class="lc">' + r.d + '</div><div class="trk" style="--v:' + pct + '"><i></i><b></b></div>';
    ll.appendChild(d);
  });

  // 蛇形棋盤：一格一年
  var bd = $('board');
  for (var i = 0; i < 60; i++){
    var age = 25 + i, t = TYPES[age], p = cellXY(i);
    var c = document.createElement('div');
    c.className = 'cell' + (t ? ' ' + t : ''); c.id = 'cell' + i;
    c.style.left = p.x + 'px'; c.style.top = p.y + 'px'; c.style.setProperty('--i', i);
    c.innerHTML = '<span class="cy">' + age + '</span><span class="ci">' + (t === 'ms' ? ICONS[age] : (t ? ICONS[t] : '')) + '</span>';
    bd.appendChild(c);
  }
  B = { idx: 0, board: bd, pawn: $('pawn'), money: 0 };
  setPawnCell(0, 0);

  // 人生一頁：每年一根柱子（一天剩幾小時）
  var lb = $('lbars'), lg = $('lghost');
  for (var j = 0; j < 60; j++){
    var a = 25 + j, h = dailyFree(a);
    var bar = document.createElement('i');
    bar.style.setProperty('--h', (h / 16.5 * 100).toFixed(1) + '%'); bar.style.setProperty('--i', j);
    if (a >= 65) bar.className = 'ret'; else if (a >= 41 && a <= 50) bar.className = 'dip';
    lb.appendChild(bar);
    var g = document.createElement('i');
    g.style.setProperty('--h', ((a >= 41 && a <= 50 ? h + 1.7 : h) / 16.5 * 100).toFixed(1) + '%');
    if (a >= 41 && a <= 50) g.className = 'g';
    lg.appendChild(g);
  }

  var rb = $('e-replay'); if (rb) rb.addEventListener('click', play);
}

/* ---------------- 棋盤操作 ---------------- */
function setPawnXY(x, y){ B.pawn.style.transform = 'translate(' + (x + CW - 24).toFixed(1) + 'px,' + (y - 5).toFixed(1) + 'px)'; }
function setPawnCell(i){ var p = cellXY(i); setPawnXY(p.x, p.y); }
function scrollBoard(i){
  var y = cellXY(i).y, view = 250 - 16, total = 12 * PY - 5;
  var sy = Math.max(0, Math.min(total - view, y - 96));
  B.board.style.transform = 'translateY(' + (-sy) + 'px)';
}
function yearInfo(age){
  if (age >= 65) return { bill:'今年花了 42 萬', sal:'今年年金 25 萬', w:100, cls:'ret' };
  if (age >= 41 && age <= 50) return { bill:'今年花了 50 萬', sal:'今年薪水 37 萬', w:100, cls:'over' };
  if (age >= 30) return { bill:'今年花了 50 萬', sal:'今年薪水 62 萬', w:81, cls:'' };
  return { bill:'今年花了 48 萬', sal:'今年薪水 55 萬', w:87, cls:'' };
}
function arrive(i, quiet){
  var age = 25 + i;
  for (var k = 0; k < i; k++){ var pc = $('cell' + k); if (pc){ pc.classList.add('past'); pc.classList.remove('now'); } }
  var cc = $('cell' + i); if (cc){ cc.classList.remove('past'); cc.classList.add('now'); if (age >= 65){ cc.classList.remove('chance','fate','ms'); cc.classList.add('retired'); cc.querySelector('.ci').textContent = '🌅'; } }
  for (var r = 40; r < i; r++){ var rc = $('cell' + r); if (rc && !rc.classList.contains('retired')){ rc.classList.remove('chance','fate','ms'); rc.classList.add('retired'); rc.querySelector('.ci').textContent = '🌅'; } }
  $('hud-age').textContent = age + ' 歲';
  B.money = moneyAt(age);
  $('hud-money').textContent = wan(B.money);
  var yi = yearInfo(age);
  $('hud-bill').textContent = yi.bill; $('hud-sal').textContent = yi.sal;
  $('freefill').style.width = yi.w + '%';
  var fb = $('freebar'); fb.classList.toggle('over', yi.cls === 'over'); fb.classList.toggle('ret', yi.cls === 'ret');
  scrollBoard(i);
}
function movePawn(from, to, stepDur, hop){
  var steps = to - from, last = from;
  tween(steps * stepDur, function(p){
    var f = from + p * steps;
    var i0 = Math.min(to - 1, Math.floor(f)), fr = f - i0;
    var a = cellXY(i0), b = cellXY(i0 + 1);
    setPawnXY(a.x + (b.x - a.x) * fr, a.y + (b.y - a.y) * fr - Math.sin(Math.PI * fr) * (hop || 12));
    var reached = p >= 1 ? to : Math.floor(f + 1e-6);
    if (reached > last){ last = reached; arrive(reached); }
  }, lin);
}
function setDice(n){ $('dice').querySelectorAll('b').forEach(function(b, i){ b.classList.toggle('on', PIPS[n].indexOf(i) >= 0); }); }
function rollDice(final){
  var d = $('dice'); d.classList.remove('rolling'); void d.offsetWidth; d.classList.add('rolling');
  tween(.6, function(p){ setDice(p >= 1 ? final : 1 + (Math.floor(p * 11) % 3)); }, lin);
}
function showEvt(key){
  var e = EVENTS[key], ev = $('evt');
  ev.className = 'evt ' + e.kind;
  ev.innerHTML = '<div class="ek" id="ek">' + e.ek + '</div><div class="et">' + e.t + '</div><div class="es">' + e.s + '</div>' +
    e.o.map(function(o, i){
      return '<div class="opt" id="opt' + i + '"><div class="oh"><b>' + o.b + '</b><span class="delta ' + o.dc + '">' + o.dt + '</span></div>' +
             '<span class="os">' + o.s + '</span><em>' + o.q + '</em></div>';
    }).join('');
  void ev.offsetWidth; ev.classList.add('in');
}
function pickOpt(i){
  $('evt').querySelectorAll('.opt').forEach(function(o, k){ o.classList.toggle('picked', k === i); o.classList.toggle('dim', k !== i); });
  tap('opt' + i, '80%', '50%');
}
function hideEvt(){ rem('evt'); }

    $('pb-f').style.width = '68%'; $('pb-w').style.width = '24%'; $('pb-c').style.width = '8%';
  });

/* ---------------- 播放控制 ---------------- */
function play(){
  cues = []; ci = 0; tweens = []; timers = [];
  build();
  script();
  cues.sort(function(a, b){ return a.t - b.t; });
  fitAll();
  ended = false; pausedAt = null; document.body.classList.remove('paused');
  cancelAnimationFrame(rafId);
  t0 = nowS(); running = true; setIcon();
  if (document.hidden){ pause(); autoPaused = true; }
  rafId = requestAnimationFrame(tick);
}
btnPause.addEventListener('click', function(){
  if (ended || !running){ play(); return; }
  if (pausedAt === null) pause(); else resume();
});
document.getElementById('btn-replay').addEventListener('click', play);
document.addEventListener('keydown', function(e){
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.code === 'Space'){ e.preventDefault(); btnPause.click(); }
  else if (e.key === 'r' || e.key === 'R'){ play(); }
});
document.addEventListener('visibilitychange', function(){
  if (document.hidden){ if (running && pausedAt === null){ pause(); autoPaused = true; } }
  else if (autoPaused){ autoPaused = false; resume(); }
});
window.addEventListener('resize', fitAll);
window.addEventListener('orientationchange', function(){ setTimeout(fitAll, 250); });

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', play); else play();
})();
